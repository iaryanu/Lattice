<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Lattice Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0c101b; --panel:#121828; --panel2:#182037; --line:#262f4c; --text:#e9edf9; --muted:#8b95b6;
    --sel:#ff6b8b; --join:#ffc857; --meet:#5be3a8; --up:#c08bff; --down:#5fb6ff; --bad:#ff8a5b;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif; font-size:14px; overflow:hidden; }
  button { font-family:inherit; color:inherit; }
  button:focus-visible { outline:2px solid #8fa2ff; outline-offset:2px; }
 
  #app { display:grid; grid-template-columns:250px minmax(0,1fr) 330px; height:100%; }
 
  /* ---------- left rail ---------- */
  #rail { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #rail header { padding:18px 16px 10px; }
  #rail h1 { font-size:18px; margin:0 0 6px; font-weight:700; letter-spacing:-.01em; }
  #rail header p { margin:0; color:var(--muted); line-height:1.5; font-size:12.5px; }
  #list { overflow-y:auto; padding:6px 10px 16px; display:flex; flex-direction:column; gap:2px; }
  .grp { margin:14px 6px 4px; color:var(--muted); font-size:12px; font-weight:600; }
  .ex { display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; width:100%;
    background:transparent; border:1px solid transparent; border-radius:8px; padding:9px 10px; cursor:pointer; font-size:13.5px; }
  .ex:hover { background:var(--panel2); }
  .ex.active { background:var(--panel2); border-color:#3b4776; }
  .ex .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .dot.dist { background:var(--meet); } .dot.nondist { background:var(--join); } .dot.nolat { background:var(--bad); }
 
  /* ---------- stage ---------- */
  #stage { position:relative; overflow:hidden; min-width:0; min-height:0; background:radial-gradient(ellipse at 50% 40%, #151c33 0%, var(--bg) 70%); }
  #stage canvas { display:block; touch-action:none; cursor:grab; }
  #stage canvas.dragging { cursor:grabbing; } #stage canvas.over { cursor:pointer; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lab { position:absolute; left:0; top:0; padding:2px 8px; border-radius:999px; font-weight:600; font-size:14px; white-space:nowrap;
    background:rgba(12,16,27,.78); border:1px solid #2f3a62; transition:background .12s,border-color .12s,color .12s; will-change:transform; }
  .lab.sel  { background:var(--sel);  color:#1a0b10; border-color:var(--sel); }
  .lab.join { background:var(--join); color:#201700; border-color:var(--join); }
  .lab.meet { background:var(--meet); color:#04241a; border-color:var(--meet); }
  .lab.up   { border-color:var(--up);   color:var(--up); }
  .lab.down { border-color:var(--down); color:var(--down); }
  .lab.hov  { background:#fff; color:#0c101b; border-color:#fff; }
 
  #toolbar { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:4px;
    background:rgba(18,24,40,.92); border:1px solid var(--line); border-radius:12px; padding:5px; backdrop-filter:blur(6px); }
  #toolbar button { background:transparent; border:0; border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; color:var(--muted); font-weight:500; }
  #toolbar button:hover { background:var(--panel2); color:var(--text); }
  #toolbar button[aria-pressed="true"] { background:#2a3560; color:var(--text); }
  #toolbar .sep { width:1px; height:20px; background:var(--line); margin:0 4px; }
  #hint { position:absolute; left:16px; top:14px; color:var(--muted); font-size:12.5px; line-height:1.5; pointer-events:none; max-width:300px; }
 
  /* ---------- info panel ---------- */
  #info { background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:18px 16px 20px; min-height:0; }
  #info h2 { margin:0 0 8px; font-size:17px; font-weight:700; letter-spacing:-.01em; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .badge { font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); }
  .badge.good { color:var(--meet); border-color:#2b6a55; } .badge.warn { color:var(--join); border-color:#6d5a24; } .badge.bad { color:var(--bad); border-color:#733d27; }
  .note { margin:0 0 16px; color:var(--muted); line-height:1.55; font-size:13px; }
  h3 { margin:18px 0 8px; font-size:12.5px; color:var(--muted); font-weight:600; }
  .slots { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .slot { display:flex; align-items:center; gap:8px; text-align:left; background:var(--panel2); border:1px dashed #38426c; border-radius:10px;
    padding:9px 10px; min-height:44px; cursor:default; color:var(--muted); font-size:13px; }
  .slot b { font-size:16px; color:var(--text); }
  .slot .k { width:20px; height:20px; border-radius:6px; background:#2a3560; display:grid; place-items:center; font-size:11px; font-weight:700; color:var(--text); flex:none; }
  .slot.filled { border-style:solid; border-color:var(--sel); cursor:pointer; }
  .slot.filled:hover { background:#2a2038; }
  .guide { color:var(--muted); line-height:1.55; font-size:13px; margin:10px 0 0; }
  .rel { margin:12px 0 8px; font-size:13px; color:var(--muted); line-height:1.5; }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card { border-radius:10px; padding:10px 12px; background:var(--panel2); border:1px solid var(--line); min-width:0; }
  .card .t { font-size:12px; color:var(--muted); font-weight:600; }
  .card .eq { font-size:12.5px; color:var(--muted); margin-top:4px; }
  .card .v { font-size:24px; font-weight:700; margin-top:2px; overflow-wrap:anywhere; line-height:1.15; }
  .card.join { border-color:#6d5a24; } .card.join .v { color:var(--join); }
  .card.meet { border-color:#2b6a55; } .card.meet .v { color:var(--meet); }
  .card.bad { border-color:#733d27; grid-column:1 / -1; } .card.bad .v { color:var(--bad); font-size:15px; }
  .card.bad p { margin:6px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:13px; font-weight:600; cursor:pointer; }
  .chip:hover { border-color:#5563a0; }
  .chip.sel { background:var(--sel); color:#1a0b10; border-color:var(--sel); }
  .chip.join { background:var(--join); color:#201700; border-color:var(--join); }
  .chip.meet { background:var(--meet); color:#04241a; border-color:var(--meet); }
  .chip.up { border-color:var(--up); color:var(--up); } .chip.down { border-color:var(--down); color:var(--down); }
  .chip.dim { opacity:.4; }
  .key { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:18px; color:var(--muted); font-size:12px; }
  .key i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:baseline; }
 
  /* ---------- mobile ---------- */
  @media (max-width:880px) {
    #app { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) minmax(0,44vh); }
    #rail { border-right:0; border-bottom:1px solid var(--line); flex-direction:row; align-items:center; }
    #rail header { display:none; }
    #list { flex-direction:row; overflow-x:auto; overflow-y:hidden; padding:8px; gap:6px; }
    .grp { display:none; }
    .ex { width:auto; white-space:nowrap; border-color:var(--line); }
    #info { border-left:0; border-top:1px solid var(--line); }
    #hint { display:none; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <header>
      <h1>Lattice explorer</h1>
      <p>A lattice is a partial order where every two elements have a join (least upper bound) and a meet (greatest lower bound).</p>
    </header>
    <nav id="list" aria-label="Examples"></nav>
  </aside>
 
  <main id="stage">
    <div id="labels"></div>
    <div id="hint">Hover a node to see what sits above and below it. Click two nodes to compare them.</div>
    <div id="toolbar" role="toolbar" aria-label="View controls">
      <button data-view="iso">Angled</button>
      <button data-view="front">Front</button>
      <button data-view="top">Top</button>
      <span class="sep"></span>
      <button id="spin" aria-pressed="true">Auto-rotate</button>
      <button id="clear">Clear</button>
    </div>
  </main>
 
  <aside id="info">
    <h2 id="title"></h2>
    <div class="badges" id="badges"></div>
    <p class="note" id="note"></p>
 
    <h3>Compare two elements</h3>
    <div class="slots" id="slots"></div>
    <div id="result"></div>
 
    <h3>All elements</h3>
    <div class="chips" id="chips"></div>
 
    <div class="key">
      <span><i style="background:var(--up)"></i>above hovered</span>
      <span><i style="background:var(--down)"></i>below hovered</span>
      <span><i style="background:var(--join)"></i>join</span>
      <span><i style="background:var(--meet)"></i>meet</span>
    </div>
  </aside>
</div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= Example definitions =================
   spec = { name, group, note, joinName, meetName, labels[], covers[[i,j],...], pos? }
   covers are Hasse edges (i is covered by j); the order is their reflexive-transitive closure. */
 
function productSpec(name, group, note, kind, max, names, jn, mn) {
  const k = max.length, elems = [];
  (function rec(i, cur) {
    if (i === k) { elems.push(cur.slice()); return; }
    for (let v = 0; v <= max[i]; v++) { cur.push(v); rec(i + 1, cur); cur.pop(); }
  })(0, []);
  const axes = max.map((_, i) => {
    const th = (2 * Math.PI * i) / k + Math.PI / 6;
    return new THREE.Vector3(Math.cos(th) * 1.5, 1.35, Math.sin(th) * 1.5);
  });
  if (k === 2) { axes[0].set(1.5, 1.35, 0.4); axes[1].set(-1.5, 1.35, 0.4); }
  const idx = new Map(elems.map((e, i) => [e.join(","), i]));
  const labels = elems.map(e => kind === "div"
    ? String(e.reduce((a, x, i) => a * Math.pow(names[i], x), 1))
    : "{" + names.filter((_, i) => e[i] > 0).join(",") + "}");
  const covers = [];
  elems.forEach((e, i) => e.forEach((x, d) => {
    if (x < max[d]) { const u = e.slice(); u[d]++; covers.push([i, idx.get(u.join(","))]); }
  }));
  const pos = elems.map(e => { const p = new THREE.Vector3(); e.forEach((x, d) => p.addScaledVector(axes[d], x)); return [p.x, p.y, p.z]; });
  return { name, group, note, joinName: jn, meetName: mn, labels, covers, pos };
}
 
function manual(name, group, note, labels, coverNames, jn, mn, pos) {
  const ix = Object.fromEntries(labels.map((l, i) => [l, i]));
  return { name, group, note, joinName: jn, meetName: mn, labels, covers: coverNames.map(([a, b]) => [ix[a], ix[b]]), pos };
}
 
function partitionLattice() {
  const parts = [];
  (function rec(i, blocks) {
    if (i > 4) { parts.push(blocks.map(b => b.slice())); return; }
    for (let b = 0; b < blocks.length; b++) { blocks[b].push(i); rec(i + 1, blocks); blocks[b].pop(); }
    blocks.push([i]); rec(i + 1, blocks); blocks.pop();
  })(1, []);
  const key = p => p.map(b => b.join("")).sort().join("|");
  const labels = parts.map(key), idx = new Map(labels.map((l, i) => [l, i])), covers = [];
  parts.forEach((p, i) => {
    for (let a = 0; a < p.length; a++) for (let b = a + 1; b < p.length; b++) {
      const q = p.filter((_, t) => t !== a && t !== b).concat([p[a].concat(p[b])]);
      covers.push([i, idx.get(key(q))]);
    }
  });
  return { name: "Partitions of {1,2,3,4}", group: "Non-distributive lattices",
    note: "Π₄ under refinement: finer partitions are lower. It contains M₃ as a sublattice, so it is not distributive.",
    joinName: "finest common coarsening", meetName: "coarsest common refinement", labels, covers, pos: null };
}
 
const SPECS = {
  d30: productSpec("Divisors of 30", "Distributive",
    "Order: divisibility. Join = lcm, meet = gcd. This is the Boolean lattice B₃, a cube.", "div", [1,1,1], [2,3,5], "lcm", "gcd"),
  pow: productSpec("Power set of {a,b,c}", "Distributive",
    "Order: ⊆. Join = union, meet = intersection. Isomorphic to the divisors of 30 (a↔2, b↔3, c↔5).", "set", [1,1,1], ["a","b","c"], "union", "intersection"),
  d60: productSpec("Divisors of 60", "Distributive",
    "Order: divisibility. A product of chains 3 × 2 × 2.", "div", [2,1,1], [2,3,5], "lcm", "gcd"),
  d36: productSpec("Divisors of 36", "Distributive",
    "Order: divisibility. A 3 × 3 grid.", "div", [2,2], [2,3], "lcm", "gcd"),
  d210: productSpec("Divisors of 210", "Distributive",
    "Boolean lattice B₄ (a 4-cube) projected into 3D.", "div", [1,1,1,1], [2,3,5,7], "lcm", "gcd"),
  chain: manual("Chain with 5 elements", "Other lattices",
    "A total order: join is the larger element, meet is the smaller. Every two elements are comparable.",
    ["1","2","3","4","5"], [["1","2"],["2","3"],["3","4"],["4","5"]], "max", "min",
    [[0,0,0],[0,1.6,0],[0,3.2,0],[0,4.8,0],[0,6.4,0]]),
  m3: manual("Diamond M₃", "Non-distributive lattices",
    "Three incomparable atoms. Any two have join 1 and meet 0, so a ∧ (b ∨ c) = a but (a ∧ b) ∨ (a ∧ c) = 0.",
    ["0","a","b","c","1"], [["0","a"],["0","b"],["0","c"],["a","1"],["b","1"],["c","1"]], "join", "meet", null),
  n5: manual("Pentagon N₅", "Non-distributive lattices",
    "Here a < b and c is incomparable to both. Not modular: a ∨ (c ∧ b) = a, but (a ∨ c) ∧ b = b.",
    ["0","a","b","c","1"], [["0","a"],["a","b"],["b","1"],["0","c"],["c","1"]], "join", "meet",
    [[0,0,0],[-1.3,1.7,0],[-1.3,3.4,0],[1.4,2.5,0],[0,4.3,0]]),
  s3: manual("Subgroups of S₃", "Non-distributive lattices",
    "Order: ⊆. Join = subgroup generated by both, meet = intersection. {e}, the three order-2 subgroups and S₃ form an M₃.",
    ["{e}","⟨s1⟩","⟨s2⟩","⟨s3⟩","A₃","S₃"],
    [["{e}","⟨s1⟩"],["{e}","⟨s2⟩"],["{e}","⟨s3⟩"],["{e}","A₃"],["⟨s1⟩","S₃"],["⟨s2⟩","S₃"],["⟨s3⟩","S₃"],["A₃","S₃"]],
    "generated subgroup", "intersection", null),
  pi4: partitionLattice(),
  bow: manual("Bowtie poset", "Not a lattice",
    "Both a and b lie below both c and d. They have two minimal upper bounds, c and d, and neither is least, so a ∨ b does not exist.",
    ["0","a","b","c","d","1"],
    [["0","a"],["0","b"],["a","c"],["a","d"],["b","c"],["b","d"],["c","1"],["d","1"]], "join", "meet", null)
};
 
/* ================= Order analysis ================= */
function analyze(spec) {
  const n = spec.labels.length;
  const le = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => i === j));
  spec.covers.forEach(([a, b]) => { le[a][b] = true; });
  for (let k = 0; k < n; k++) for (let i = 0; i < n; i++) if (le[i][k]) for (let j = 0; j < n; j++) if (le[k][j]) le[i][j] = true;
  const all = [...Array(n).keys()];
  const least = s => s.find(u => s.every(v => le[u][v]));
  const greatest = s => s.find(u => s.every(v => le[v][u]));
  const minimal = s => s.filter(u => !s.some(v => v !== u && le[v][u]));
  const maximal = s => s.filter(u => !s.some(v => v !== u && le[u][v]));
  function bounds(i, j) {
    const up = all.filter(u => le[i][u] && le[j][u]), lo = all.filter(u => le[u][i] && le[u][j]);
    const J = least(up), M = greatest(lo);
    return { up, lo, J: J === undefined ? -1 : J, M: M === undefined ? -1 : M };
  }
  const JT = [], MT = []; let isLattice = true;
  for (let i = 0; i < n; i++) { JT[i] = []; MT[i] = [];
    for (let j = 0; j < n; j++) { const b = bounds(i, j); JT[i][j] = b.J; MT[i][j] = b.M; if (b.J < 0 || b.M < 0) isLattice = false; } }
  let distributive = null;
  if (isLattice) {
    distributive = true;
    outer: for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) for (let c = 0; c < n; c++)
      if (MT[a][JT[b][c]] !== JT[MT[a][b]][MT[a][c]]) { distributive = false; break outer; }
  }
  const rank = Array(n).fill(0);
  for (let p = 0; p < n; p++) spec.covers.forEach(([a, b]) => { rank[b] = Math.max(rank[b], rank[a] + 1); });
  return { n, le, bounds, minimal, maximal, isLattice, distributive, rank, height: Math.max(...rank) };
}
Object.values(SPECS).forEach(s => { s.A = analyze(s); s.tag = !s.A.isLattice ? "nolat" : s.A.distributive ? "dist" : "nondist"; });
 
/* ================= Three.js scene ================= */
const stage = document.getElementById("stage");
const labelsEl = document.getElementById("labels");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.insertBefore(renderer.domElement, labelsEl);
const canvas = renderer.domElement;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const keyLight = new THREE.DirectionalLight(0xffffff, 0.9); keyLight.position.set(5, 8, 6); scene.add(keyLight);
const world = new THREE.Group(); world.rotation.set(0.35, 0.6, 0); scene.add(world);
 
const C = { sel: new THREE.Color("#ff6b8b"), join: new THREE.Color("#ffc857"), meet: new THREE.Color("#5be3a8"),
            up: new THREE.Color("#c08bff"), down: new THREE.Color("#5fb6ff"),
            edge: new THREE.Color("#4d5b95"), edgeDim: new THREE.Color("#222a47") };
const VIEWS = { iso: { x: 0.35, y: 0.6 }, front: { x: 0, y: 0 }, top: { x: 1.35, y: 0 } };
 
let G = null, selected = [], hover = -1, overlay = [], tween = null, autoSpin = true;
let camDist = 10, W = 1, H = 1;
 
function fitDist() {
  if (!G) return;
  const vf = camera.fov * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  camDist = (G.R + 0.9) / Math.sin(Math.min(vf, hf) / 2);
}
function resize() {
  W = stage.clientWidth; H = stage.clientHeight;
  renderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix(); fitDist();
}
new ResizeObserver(resize).observe(stage);
 
function clearWorld() {
  while (world.children.length) {
    const o = world.children.pop();
    o.traverse(n => { if (n.geometry) n.geometry.dispose(); if (n.material) n.material.dispose(); });
  }
  overlay = []; labelsEl.innerHTML = "";
}
function autoLayout(spec, rank) {
  const layers = {}; spec.labels.forEach((l, i) => (layers[rank[i]] = layers[rank[i]] || []).push(i));
  const pos = [];
  Object.keys(layers).forEach(r => {
    const ids = layers[r].sort((a, b) => spec.labels[a].localeCompare(spec.labels[b]));
    const rad = ids.length === 1 ? 0 : 0.35 * ids.length + 0.7;
    ids.forEach((id, t) => { const th = (2 * Math.PI * t) / ids.length + r * 0.5; pos[id] = [Math.cos(th) * rad, r * 1.8, Math.sin(th) * rad]; });
  });
  return pos;
}
 
/* ================= Build an example ================= */
const $ = id => document.getElementById(id);
function build(key) {
  const spec = SPECS[key], A = spec.A;
  clearWorld(); selected = []; hover = -1;
  const raw = spec.pos || autoLayout(spec, A.rank);
  const pts = raw.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const ctr = new THREE.Box3().setFromPoints(pts).getCenter(new THREE.Vector3());
  pts.forEach(p => p.sub(ctr));
  const R = Math.max(...pts.map(p => p.length()), 1);
 
  const ev = [], ec = [];
  spec.covers.forEach(([a, b]) => { ev.push(pts[a].x, pts[a].y, pts[a].z, pts[b].x, pts[b].y, pts[b].z); ec.push(0,0,0,0,0,0); });
  const eg = new THREE.BufferGeometry();
  eg.setAttribute("position", new THREE.Float32BufferAttribute(ev, 3));
  eg.setAttribute("color", new THREE.Float32BufferAttribute(ec, 3));
  const edges = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ vertexColors: true }));
  world.add(edges);
 
  const maxRank = Math.max(A.height, 1);
  const nodes = spec.labels.map((label, i) => {
    const base = new THREE.Color().setHSL(0.62 - 0.62 * (A.rank[i] / maxRank), 0.65, 0.58);
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.26, 24, 18),
      new THREE.MeshStandardMaterial({ color: base, roughness: 0.4, metalness: 0.15, transparent: true }));
    mesh.position.copy(pts[i]);
    world.add(mesh);
    // larger invisible target so nodes are easy to hover and click
    const hit = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    hit.position.copy(pts[i]); hit.userData.idx = i; world.add(hit);
    const lab = document.createElement("div"); lab.className = "lab"; lab.textContent = label; labelsEl.appendChild(lab);
    const chip = document.createElement("button"); chip.className = "chip"; chip.textContent = label;
    chip.addEventListener("click", () => toggle(i));
    chip.addEventListener("mouseenter", () => { hover = i; refresh(); });
    chip.addEventListener("mouseleave", () => { hover = -1; refresh(); });
    return { label, pos: pts[i], mesh, hit, base, lab, chip };
  });
  G = { key, spec, A, nodes, edges, R };
  nodes.forEach(n => {});
  const chips = $("chips"); chips.innerHTML = ""; nodes.forEach(n => chips.appendChild(n.chip));
 
  $("title").textContent = spec.name;
  $("note").textContent = spec.note;
  const b = [];
  b.push(A.isLattice ? '<span class="badge good">Lattice</span>' : '<span class="badge bad">Not a lattice</span>');
  if (A.isLattice) b.push(A.distributive ? '<span class="badge good">Distributive</span>' : '<span class="badge warn">Not distributive</span>');
  b.push(`<span class="badge">${A.n} elements</span>`, `<span class="badge">height ${A.height}</span>`);
  $("badges").innerHTML = b.join("");
  document.querySelectorAll(".ex").forEach(e => e.classList.toggle("active", e.dataset.k === key));
 
  fitDist();
  tweenTo("iso");
  refresh();
}
 
/* ================= State -> visuals ================= */
function addLink(a, b, color) {
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([G.nodes[a].pos, G.nodes[b].pos]),
    new THREE.LineDashedMaterial({ color, dashSize: 0.18, gapSize: 0.1 }));
  l.computeLineDistances(); world.add(l); overlay.push(l);
}
const L = i => G.nodes[i].label;
const names = a => a.map(L).join(", ");
 
function refresh() {
  const { A, nodes, spec } = G, n = A.n, le = A.le;
  overlay.forEach(l => { world.remove(l); l.geometry.dispose(); l.material.dispose(); }); overlay = [];
  const st = Array(n).fill("");
  const h = hover >= 0 && selected.length < 2 ? hover : -1;
  if (h >= 0) for (let i = 0; i < n; i++) st[i] = i === h ? "hov" : le[h][i] ? "up" : le[i][h] ? "down" : "dim";
 
  let resultHTML = "";
  selected.forEach(i => st[i] = "sel");
  if (selected.length === 2) {
    const [i, j] = selected, b = A.bounds(i, j);
    const ups = b.J >= 0 ? [b.J] : A.minimal(b.up), los = b.M >= 0 ? [b.M] : A.maximal(b.lo);
    ups.forEach(u => { if (!selected.includes(u)) st[u] = "join"; addLink(i, u, 0xffc857); addLink(j, u, 0xffc857); });
    los.forEach(u => { if (!selected.includes(u)) st[u] = "meet"; addLink(i, u, 0x5be3a8); addLink(j, u, 0x5be3a8); });
    const rel = le[i][j] ? `<b>${L(i)}</b> ≤ <b>${L(j)}</b>, so they are comparable.`
              : le[j][i] ? `<b>${L(j)}</b> ≤ <b>${L(i)}</b>, so they are comparable.`
              : `<b>${L(i)}</b> and <b>${L(j)}</b> are incomparable.`;
    resultHTML = `<p class="rel">${rel}</p><div class="cards">` +
      (b.J >= 0 ? `<div class="card join"><div class="t">Join (${spec.joinName})</div><div class="eq">${L(i)} ∨ ${L(j)}</div><div class="v">${L(b.J)}</div></div>`
        : `<div class="card bad"><div class="t">No join</div><div class="v">Upper bounds have no least element</div><p>Upper bounds: ${names(b.up) || "none"}.<br>Minimal ones: ${names(ups) || "none"}.</p></div>`) +
      (b.M >= 0 ? `<div class="card meet"><div class="t">Meet (${spec.meetName})</div><div class="eq">${L(i)} ∧ ${L(j)}</div><div class="v">${L(b.M)}</div></div>`
        : `<div class="card bad"><div class="t">No meet</div><div class="v">Lower bounds have no greatest element</div><p>Lower bounds: ${names(b.lo) || "none"}.<br>Maximal ones: ${names(los) || "none"}.</p></div>`) +
      `</div>`;
  } else {
    resultHTML = `<p class="guide">${selected.length === 0
      ? "Click two nodes in the 3D view, or pick elements from the list below."
      : "Pick one more element to see its join and meet."}</p>`;
  }
 
  nodes.forEach((nd, i) => {
    const s = st[i], m = nd.mesh.material;
    let col = nd.base, em = 0, sc = 1, op = 1;
    if (s === "sel") { col = C.sel; em = .35; sc = 1.4; }
    else if (s === "join") { col = C.join; em = .35; sc = 1.35; }
    else if (s === "meet") { col = C.meet; em = .35; sc = 1.35; }
    else if (s === "hov") { em = .3; sc = 1.35; }
    else if (s === "up") { col = C.up; em = .2; sc = 1.15; }
    else if (s === "down") { col = C.down; em = .2; sc = 1.15; }
    else if (s === "dim") op = .22;
    m.color.copy(col); m.emissive.copy(col).multiplyScalar(em); m.opacity = op; nd.mesh.scale.setScalar(sc);
    nd.lab.className = "lab" + (s && s !== "dim" ? " " + s : ""); nd.dim = s === "dim";
    nd.chip.className = "chip" + (s ? " " + s : "");
  });
 
  const colAttr = G.edges.geometry.attributes.color;
  spec.covers.forEach(([a, b], k) => {
    let c = C.edge;
    if (h >= 0) c = le[h][a] ? C.up : le[b][h] ? C.down : C.edgeDim;
    for (let t = 0; t < 2; t++) colAttr.setXYZ(k * 2 + t, c.r, c.g, c.b);
  });
  colAttr.needsUpdate = true;
 
  // slots
  const slot = (k, i) => i === undefined
    ? `<div class="slot"><span class="k">${k}</span>pick an element</div>`
    : `<button class="slot filled" data-i="${i}" title="Click to remove"><span class="k">${k}</span><b>${L(i)}</b></button>`;
  $("slots").innerHTML = slot("A", selected[0]) + slot("B", selected[1]);
  $("slots").querySelectorAll(".slot.filled").forEach(el => el.addEventListener("click", () => toggle(+el.dataset.i)));
  $("result").innerHTML = resultHTML;
}
 
function toggle(i) {
  if (selected.includes(i)) selected = selected.filter(x => x !== i);
  else if (selected.length >= 2) selected = [i];
  else selected.push(i);
  refresh();
}
 
function updateLabels() {
  if (!G) return;
  camera.updateMatrixWorld(); world.updateMatrixWorld();
  const ds = G.nodes.map(n => { n.wp = n.pos.clone().applyMatrix4(world.matrixWorld); return n.wp.distanceTo(camera.position); });
  const dmin = Math.min(...ds), dmax = Math.max(...ds), span = dmax - dmin || 1;
  G.nodes.forEach((n, i) => {
    const v = n.wp.clone().project(camera);
    const x = (v.x * 0.5 + 0.5) * W, y = (-v.y * 0.5 + 0.5) * H - 20;
    n.lab.style.transform = `translate(${x}px,${y}px) translate(-50%,-100%)`;
    n.lab.style.zIndex = String(Math.round(1000 - ds[i] * 10));
    n.lab.style.opacity = String((1 - 0.5 * (ds[i] - dmin) / span) * (n.dim ? 0.3 : 1));
  });
}
 
/* ================= Interaction ================= */
let dragging = false, moved = 0, lastX = 0, lastY = 0, pinchStart = 0, camStart = 0;
const pointers = new Map(), ray = new THREE.Raycaster();
 
function nodeAt(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1), camera);
  const hits = ray.intersectObjects(G.nodes.map(n => n.hit));
  return hits.length ? hits[0].object.userData.idx : -1;
}
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchStart = Math.hypot(a.x - b.x, a.y - b.y); camStart = camDist; }
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; tween = null; canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) {            // plain hover
    if (e.pointerType === "mouse" && G) {
      const i = nodeAt(e.clientX, e.clientY);
      canvas.classList.toggle("over", i >= 0);
      if (i !== hover) { hover = i; refresh(); }
    }
    return;
  }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()];
    camDist = Math.min(60, Math.max(4, camStart * pinchStart / Math.hypot(a.x - b.x, a.y - b.y))); return; }
  const dx = e.clientX - lastX, dy = e.clientY - lastY; moved += Math.abs(dx) + Math.abs(dy);
  world.rotation.y += dx * 0.008;
  world.rotation.x = Math.max(-1.45, Math.min(1.45, world.rotation.x + dy * 0.008));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener("pointerup", e => {
  pointers.delete(e.pointerId); canvas.classList.remove("dragging");
  if (moved < 5 && pointers.size === 0) { const i = nodeAt(e.clientX, e.clientY); if (i >= 0) toggle(i); }
  dragging = false;
});
canvas.addEventListener("pointercancel", e => { pointers.delete(e.pointerId); dragging = false; canvas.classList.remove("dragging"); });
canvas.addEventListener("pointerleave", () => { if (hover >= 0 && !pointers.size) { hover = -1; canvas.classList.remove("over"); refresh(); } });
canvas.addEventListener("wheel", e => { e.preventDefault(); camDist = Math.min(60, Math.max(4, camDist * (1 + e.deltaY * 0.001))); }, { passive: false });
 
function tweenTo(name) {
  const v = VIEWS[name]; if (!v) return;
  world.rotation.y = ((world.rotation.y + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  tween = { x: v.x, y: v.y };
}
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => tweenTo(b.dataset.view)));
function setSpin(on) { autoSpin = on; $("spin").setAttribute("aria-pressed", String(on)); }
$("spin").addEventListener("click", () => setSpin(!autoSpin));
$("clear").addEventListener("click", () => { selected = []; refresh(); });
addEventListener("keydown", e => {
  if (e.key === "Escape") { selected = []; refresh(); }
  else if (e.key === "r" || e.key === "R") setSpin(!autoSpin);
  else if (e.key === "1") tweenTo("iso"); else if (e.key === "2") tweenTo("front"); else if (e.key === "3") tweenTo("top");
});
 
// example list
const list = $("list"); let lastGroup = null;
const tagText = { dist: "distributive", nondist: "non-distributive", nolat: "not a lattice" };
Object.keys(SPECS).forEach(k => {
  const s = SPECS[k];
  if (s.group !== lastGroup) { const g = document.createElement("div"); g.className = "grp"; g.textContent = s.group; list.appendChild(g); lastGroup = s.group; }
  const b = document.createElement("button"); b.className = "ex"; b.dataset.k = k;
  b.innerHTML = `<span>${s.name}</span><span class="dot ${s.tag}" title="${tagText[s.tag]}"></span>`;
  b.addEventListener("click", () => build(k)); list.appendChild(b);
});
 
if (matchMedia("(prefers-reduced-motion: reduce)").matches) setSpin(false);
 
/* ================= Loop ================= */
function animate() {
  requestAnimationFrame(animate);
  if (tween) {
    world.rotation.x += (tween.x - world.rotation.x) * 0.12;
    world.rotation.y += (tween.y - world.rotation.y) * 0.12;
    if (Math.abs(tween.x - world.rotation.x) < 0.003 && Math.abs(tween.y - world.rotation.y) < 0.003) tween = null;
  } else if (autoSpin && !dragging) world.rotation.y += 0.004;
  camera.position.z += (camDist - camera.position.z) * 0.12;
  renderer.render(scene, camera);
  updateLabels();
}
resize();
build("d30");
animate();
</script>
</body>
